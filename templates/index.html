<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate Records</title>

<!-- Discord & Open Graph Preview Tags -->
<meta property="og:type" content="website">
<meta property="og:title" content="Debate Arena — Official Leaderboard">
<meta property="og:description" content="View live rankings, speaker profiles, wins, losses, and debate analytics.">
<meta property="og:url" content="https://debate-dashboard.onrender.com/">
<meta name="theme-color" content="#5865F2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Space Grotesk"', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  :root { --violet:#a855f7; --orchid:#d946ef; --win:#4ade80; --loss:#fb7185; --draw:#fbbf24; }
  body { background:#08060f; color:#e9e4f5;
    background-image: radial-gradient(60rem 30rem at 15% -10%, rgba(168,85,247,.22), transparent 60%),
                      radial-gradient(40rem 25rem at 100% 0%, rgba(217,70,239,.12), transparent 60%);
    background-attachment: fixed; }
  .panel { background:rgba(20,14,36,.7); border:1px solid rgba(168,85,247,.22); border-radius:1rem;
    backdrop-filter: blur(8px); }
  .neon { color:#d8b4fe; text-shadow:0 0 18px rgba(168,85,247,.8), 0 0 42px rgba(168,85,247,.45); }
  .glow { box-shadow:0 0 0 1px rgba(168,85,247,.6), 0 0 28px rgba(168,85,247,.35); }
  .btn { background:linear-gradient(135deg,#9333ea,#c026d3); color:#fff; border-radius:.75rem; font-weight:600; }
  .btn:hover { filter:brightness(1.15); box-shadow:0 0 22px rgba(168,85,247,.55); }
  .btn:disabled { opacity:.35; pointer-events:none; }
  .tab { padding:.6rem 1rem; border-radius:.75rem; color:#a79bc4; font-weight:500; }
  .tab[aria-selected="true"] { color:#fff; background:rgba(168,85,247,.2); box-shadow:inset 0 0 0 1px rgba(168,85,247,.55); }
  .link { color:inherit; text-align:left; } .link:hover { color:#d8b4fe; text-decoration:underline; }
  :focus-visible { outline:2px solid var(--orchid); outline-offset:2px; }
  .rank1 { background:linear-gradient(135deg,#a855f7,#d946ef); color:#fff; box-shadow:0 0 18px rgba(217,70,239,.6); }
  .rank2 { background:rgba(216,180,254,.25); color:#e9d5ff; } .rank3 { background:rgba(168,85,247,.15); color:#d8b4fe; }
  .side-win { background:rgba(168,85,247,.16); box-shadow:inset 0 0 0 1px rgba(168,85,247,.7); }
  .side-lose { opacity:.6; }
  select, input { color-scheme: dark; }
  .scroll { scrollbar-color:#6b21a8 transparent; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body class="font-sans min-h-screen antialiased">
<div class="max-w-5xl mx-auto px-4 pb-16">

  <header class="pt-10 pb-6">
    <h1 class="text-4xl sm:text-6xl font-bold tracking-tight neon">Debate Records</h1>
    <p class="mt-2 text-violet-200/60">Every finished debate, ranked and searchable.</p>
    <form id="search-form" class="mt-6 flex gap-2" role="search">
      <label for="q" class="sr-only">Username or user ID</label>
      <input id="q" type="search" autocomplete="off" placeholder="Find a debater by username or user ID"
        class="flex-1 min-w-0 bg-black/40 border border-violet-500/30 rounded-xl px-4 py-3 placeholder-violet-200/30 focus:border-violet-400">
      <button class="btn px-5 sm:px-7">Search</button>
    </form>
  </header>

  <section class="grid grid-cols-3 gap-3 mb-6" aria-label="Summary">
    <div class="panel p-3 sm:p-4"><div id="stat-debates" class="text-2xl sm:text-3xl font-bold text-violet-200">–</div><div class="text-xs sm:text-sm text-violet-200/50">Debates finished</div></div>
    <div class="panel p-3 sm:p-4"><div id="stat-debaters" class="text-2xl sm:text-3xl font-bold text-violet-200">–</div><div class="text-xs sm:text-sm text-violet-200/50">Debaters</div></div>
    <div class="panel p-3 sm:p-4"><div id="stat-top" class="text-lg sm:text-3xl font-bold text-violet-200 truncate">–</div><div class="text-xs sm:text-sm text-violet-200/50">Most wins</div></div>
  </section>

  <nav class="flex gap-1 mb-5 overflow-x-auto" role="tablist">
    <button class="tab" role="tab" data-tab="leaderboard" aria-selected="true">Leaderboard</button>
    <button class="tab" role="tab" data-tab="debates" aria-selected="false">All debates</button>
    <button class="tab" role="tab" data-tab="profile" aria-selected="false">Debater profile</button>
  </nav>

  <!-- Leaderboard -->
  <section id="tab-leaderboard" class="panel overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead class="text-sm text-violet-200/50 border-b border-violet-500/20">
          <tr><th class="py-3 pl-4 w-14">Rank</th><th>Debater</th>
            <th class="text-right px-2 sm:px-4">Wins</th><th class="text-right px-2 sm:px-4">Losses</th>
            <th class="text-right px-2 sm:px-4">Draws</th><th class="hidden sm:table-cell pr-4 w-44">Win rate</th></tr>
        </thead>
        <tbody id="lb-body"></tbody>
      </table>
    </div>
  </section>

  <!-- Debates -->
  <section id="tab-debates" hidden>
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <p id="debate-count" class="text-violet-200/60"></p>
      <label class="flex items-center gap-2 text-sm text-violet-200/60">Sort by
        <select id="sort" class="bg-black/50 border border-violet-500/40 rounded-lg px-3 py-2 text-violet-100 focus:border-violet-400">
          <option value="newest">Newest to oldest</option>
          <option value="oldest">Oldest to newest</option>
        </select>
      </label>
    </div>
    <div id="debate-list" class="space-y-3"></div>
    <div class="flex items-center justify-between mt-5">
      <button id="prev" class="btn px-4 py-2">Previous</button>
      <span id="page-info" class="text-violet-200/60 text-sm"></span>
      <button id="next" class="btn px-4 py-2">Next</button>
    </div>
  </section>

  <!-- Profile -->
  <section id="tab-profile" hidden>
    <div id="profile-box"><div class="panel p-8 text-center text-violet-200/50">Search for a debater above to see their record and past debates.</div></div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { sort: 'newest', page: 1, pages: 1 };
const notice = (msg) => `<div class="panel p-8 text-center text-violet-200/60">${esc(msg)}</div>`;

async function api(path, params = {}) {
  const url = new URL(path, location.origin);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

const userLink = (p, cls = '') => `<button type="button" class="link ${cls}" data-uid="${esc(p.id)}">${esc(p.name)}</button>`;

function showTab(name) {
  document.querySelectorAll('[data-tab]').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
  ['leaderboard', 'debates', 'profile'].forEach(n => { $('#tab-' + n).hidden = n !== name; });
}

/* Leaderboard */
async function loadLeaderboard() {
  try {
    const { rows } = await api('/api/leaderboard');
    $('#stat-debaters').textContent = rows.length;
    $('#stat-top').textContent = rows.length ? rows[0].name : '–';
    if (!rows.length) { $('#lb-body').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-violet-200/50">No results recorded yet.</td></tr>`; return; }
    $('#lb-body').innerHTML = rows.map(r => `
      <tr class="border-b border-violet-500/10 hover:bg-violet-500/5">
        <td class="py-3 pl-4"><span class="inline-flex w-8 h-8 items-center justify-center rounded-full font-bold ${r.rank <= 3 ? 'rank' + r.rank : 'text-violet-200/50'}">${r.rank}</span></td>
        <td class="font-medium">${userLink(r, r.rank === 1 ? 'neon' : '')}<div class="sm:hidden text-xs text-violet-200/40">${r.win_rate}% win rate</div></td>
        <td class="text-right px-2 sm:px-4 font-semibold" style="color:var(--win)">${r.wins}</td>
        <td class="text-right px-2 sm:px-4 font-semibold" style="color:var(--loss)">${r.losses}</td>
        <td class="text-right px-2 sm:px-4 font-semibold" style="color:var(--draw)">${r.draws}</td>
        <td class="hidden sm:table-cell pr-4"><div class="flex items-center gap-2"><div class="h-1.5 flex-1 rounded-full bg-violet-500/15"><div class="h-full rounded-full" style="width:${r.win_rate}%;background:linear-gradient(90deg,#9333ea,#d946ef)"></div></div><span class="text-sm text-violet-200/60 w-10 text-right">${r.win_rate}%</span></div></td>
      </tr>`).join('');
  } catch (e) { $('#lb-body').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-300">${esc(e.message)}</td></tr>`; }
}

/* Debates */
const resultLabel = { aff: 'Affirmative won', neg: 'Negative won', draw: 'Draw' };

function sideBox(label, p, side, result) {
  const cls = result === side ? 'side-win' : (result === 'aff' || result === 'neg') ? 'side-lose' : 'bg-white/5';
  return `<div class="rounded-xl p-3 ${cls}"><div class="text-xs text-violet-200/50">${label}${result === side ? ' · winner' : ''}</div>
    <div class="font-semibold truncate">${userLink(p, 'max-w-full truncate')}</div></div>`;
}

const links = (d) => [d.start_link && ['Start', d.start_link], d.conclusion_link && ['Conclusion', d.conclusion_link]]
  .filter(Boolean).map(([t, u]) => `<a class="text-violet-300 hover:underline" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`).join('<span class="text-violet-200/20 px-1">/</span>');

function debateCard(d) {
  const pill = d.result === 'draw' ? 'color:var(--draw);background:rgba(251,191,36,.12)' : 'color:#e9d5ff;background:rgba(168,85,247,.2)';
  return `<article class="panel p-4">
    <div class="flex flex-wrap items-center gap-2 text-sm">
      <span class="font-bold text-violet-300">Debate #${d.number}</span>
      <span class="px-2 py-0.5 rounded-full text-xs" style="${pill}">${resultLabel[d.result] || 'No result'}</span>
      <span class="ml-auto text-xs">${links(d)}</span>
    </div>
    <p class="mt-2 mb-3 text-lg leading-snug">${esc(d.notion)}</p>
    <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] items-center gap-2">
      ${sideBox('Affirmative', d.aff, 'aff', d.result)}
      <span class="text-center text-violet-200/40 text-sm">vs</span>
      ${sideBox('Negative', d.neg, 'neg', d.result)}
    </div></article>`;
}

async function loadDebates() {
  $('#debate-list').innerHTML = notice('Loading debates…');
  try {
    const data = await api('/api/debates', { sort: state.sort, page: state.page });
    state.pages = data.pages;
    $('#stat-debates').textContent = data.total;
    $('#debate-count').textContent = `${data.total} finished debate${data.total === 1 ? '' : 's'}`;
    $('#page-info').textContent = `Page ${data.page} of ${data.pages}`;
    $('#prev').disabled = data.page <= 1;
    $('#next').disabled = data.page >= data.pages;
    $('#debate-list').innerHTML = data.debates.length ? data.debates.map(debateCard).join('') : notice('No finished debates yet.');
  } catch (e) { $('#debate-list').innerHTML = notice(e.message); }
}

/* Profile */
const chip = { W: ['Win', 'var(--win)'], L: ['Loss', 'var(--loss)'], D: ['Draw', 'var(--draw)'] };

function renderProfile(u) {
  const streak = u.streak ? `${u.streak.length} ${chip[u.streak.kind][0].toLowerCase()}${u.streak.length > 1 && u.streak.kind !== 'L' ? 's' : u.streak.length > 1 ? 'es' : ''}` : '–';
  const stat = (v, l, c) => `<div class="rounded-xl bg-black/30 p-3"><div class="text-2xl font-bold" style="color:${c}">${v}</div><div class="text-xs text-violet-200/50">${l}</div></div>`;
  const form = u.debates.filter(d => d.outcome).slice(0, 10).map(d => `<span title="Debate #${d.number}: ${chip[d.outcome][0]}" class="w-3 h-3 rounded-full" style="background:${chip[d.outcome][1]}"></span>`).join('');
  const rows = u.debates.map(d => `<li class="py-3 border-b border-violet-500/10 last:border-0">
      <div class="flex items-center gap-2 text-sm">
        ${d.outcome ? `<span class="font-semibold" style="color:${chip[d.outcome][1]}">${chip[d.outcome][0]}</span>` : '<span class="text-violet-200/40">No result</span>'}
        <span class="text-violet-300">Debate #${d.number}</span>
        <span class="text-violet-200/40">as ${d.side === 'aff' ? 'affirmative' : 'negative'}</span>
        <span class="ml-auto text-xs">${links(d)}</span></div>
      <p class="mt-1">${esc(d.notion)}</p>
      <p class="text-sm text-violet-200/50">against ${userLink(d.opponent)}</p></li>`).join('');
  $('#profile-box').innerHTML = `
    <div class="panel p-5 glow">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-full rank1 flex items-center justify-center text-2xl font-bold">${esc(u.name.slice(0, 1).toUpperCase())}</div>
        <div class="min-w-0"><h2 class="text-2xl font-bold truncate neon">${esc(u.name)}</h2><div class="text-xs text-violet-200/40 break-all">ID ${esc(u.id)}</div></div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-5">
        ${stat(u.wins, 'Wins', 'var(--win)')}${stat(u.losses, 'Losses', 'var(--loss)')}${stat(u.draws, 'Draws', 'var(--draw)')}
        ${stat(u.win_rate + '%', 'Win rate', '#d8b4fe')}${stat(streak, 'Current streak', '#d8b4fe')}
      </div>
      ${form ? `<div class="mt-4 flex items-center gap-2 text-sm text-violet-200/50">Last ${Math.min(10, u.debates.length)} results, newest first <span class="flex gap-1.5 ml-1">${form}</span></div>` : ''}
    </div>
    <div class="panel p-4 mt-4">
      <h3 class="font-semibold mb-1">Past debates (${u.debates.length})</h3>
      <ul class="max-h-[32rem] overflow-y-auto scroll pr-2">${rows || '<li class="py-6 text-center text-violet-200/50">No finished debates for this debater.</li>'}</ul>
    </div>`;
}

async function searchUser(q) {
  showTab('profile');
  $('#profile-box').innerHTML = notice('Searching…');
  try {
    const data = await api('/api/user', { q });
    if (data.user) return renderProfile(data.user);
    $('#profile-box').innerHTML = `<div class="panel p-5"><p class="mb-3 text-violet-200/60">Several debaters match. Pick one:</p>
      <div class="flex flex-wrap gap-2">${data.matches.map(m => `<button type="button" class="tab border border-violet-500/30" data-uid="${esc(m.id)}">${esc(m.name)}</button>`).join('')}</div></div>`;
  } catch (e) { $('#profile-box').innerHTML = notice(e.message); }
}

/* Events */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (t) showTab(t.dataset.tab);
  const u = e.target.closest('[data-uid]'); if (u) { $('#q').value = u.dataset.uid; searchUser(u.dataset.uid); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
$('#search-form').addEventListener('submit', (e) => { e.preventDefault(); const q = $('#q').value.trim(); if (q) searchUser(q); });
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; state.page = 1; loadDebates(); });
$('#prev').addEventListener('click', () => { state.page--; loadDebates(); $('#tab-debates').scrollIntoView({ behavior: 'smooth' }); });
$('#next').addEventListener('click', () => { state.page++; loadDebates(); $('#tab-debates').scrollIntoView({ behavior: 'smooth' }); });

loadLeaderboard();
loadDebates();
</script>
</body>
</html>
